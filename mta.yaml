_schema-version: "3.3"
ID: upload-bill-of-material
version: 1.0.0
description: CAP and Fiori app for uploading bill of material line items.

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build

modules:
  - name: upload-bill-of-material-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: upload-bill-of-material-db
      - name: upload-bill-of-material-auth

  - name: upload-bill-of-material-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: upload-bill-of-material-db

  - name: upload-bill-of-material-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: upload-bill-of-material-html5-repo-host
        parameters:
          content-target: true
      - name: upload-bill-of-material-destination
      - name: upload-bill-of-material-auth
    build-parameters:
      build-result: resources
      requires:
        - name: upload-bom
          artifacts:
            - upload-bom.zip
          target-path: resources/

  - name: upload-bom
    type: html5
    path: app/upload-bom
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  - name: upload-bill-of-material-destination-content
    type: com.sap.application.content
    path: .
    requires:
      - name: srv-api
      - name: upload-bill-of-material-auth
      - name: upload-bill-of-material-destination
        parameters:
          content-target: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: srv-api
              Type: HTTP
              ProxyType: Internet
              URL: ~{srv-api/srv-url}
              Authentication: NoAuthentication
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true

resources:
  - name: upload-bill-of-material-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: upload-bill-of-material-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: upload-bill-of-material-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: upload-bill-of-material-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
